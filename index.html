<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <title>Kalkulator</title>
    <style>
      body{
        background-image: linear-gradient( 179deg,  rgba(0,0,0,1) 9.2%, rgba(127,16,16,1) 103.9% );
      }

      .calculator{
        width: 320px;
        border-radius: 10px;
      }
      #display{
        font-size: 30px;
        height: 60px;
        background-color: transparent;
      }

      button{
        font-size: 30px;
        height: 60px;
      }

      p{
        font-size: 30px;
      }
    </style>
  </head>
  <body class="bg-light d-flex justify-content-center align-itemscenter vh-100">
    <div class="calculator card shadow p-4 bg-dark bg-opacity-50 mb-5 mt-5 mt-auto">
      <h1 class="text-center mb-3 text-white fw-bold font-monospace">Kalkulator</h1>
      <input type="text" id="display" class="form-control mb-3 text-end text-white" disabled>
      <div class="row g-2">
        <!--Buttons-->
        <div class="col-3"><Button class="btn btn-secondary w-100" onclick="clearDisplay()">C</Button></div>
        <div class="col-3"><Button class="btn btn-secondary w-100" onclick="appendToDisplay('/')">/</Button></div>
        <div class="col-3"><Button class="btn btn-secondary w-100" onclick="appendToDisplay('×')">×</Button></div>
        <div class="col-3"><Button class="btn btn-danger w-100" onclick="deletelist()">←</Button></div>
        
        
        
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('7')">7</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('8')">8</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('9')">9</Button></div>
        <div class="col-3"><Button class="btn btn-secondary w-100" onclick="appendToDisplay('-')">-</Button></div>

        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('4')">4</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('5')">5</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('6')">6</Button></div>
        <div class="col-3"><Button class="btn btn-secondary w-100" onclick="appendToDisplay('+')">+</Button></div>

        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('1')">1</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('2')">2</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay('3')">3</Button></div>
        <div class="col-3" rowspan="2"><Button class="btn btn-primary w-100 h-100" onclick="calculate()">=</Button></div>
      
        <div class="col-6"><Button class="btn btn-light w-100" onclick="appendToDisplay('0')">0</Button></div>
        <div class="col-3"><Button class="btn btn-light w-100" onclick="appendToDisplay(',')">,</Button></div>
     
        <div class="row g-2 text-white text-center font-monospace fw-bold"> <p id="typing"></p></div>
      </div>
    </div>


<script>
function appendToDisplay(value) {
    const display = document.getElementById('display');
    const current = unformatNumber(display.value);
    const operators = ['+', '-', '*', '/'];
    const lastChar = current.slice(-1);

    if (operators.includes(value)) {
        if (current === '' || operators.includes(lastChar)) {
            return;
        }
        display.value = formatNumber(current) + value;
    } else {
        const newVal = current + value;
        display.value = formatNumber(newVal);
    }
}



  function clearDisplay(){
    document.getElementById('display').value = '';
  }

  function deletelist(){
    const display = document.getElementById('display');
    display.value = display.value.slice(0, -1);
  }
  function calculate() {
    try {
        let expression = document.getElementById('display').value;
        expression = unformatNumber(expression);
        expression = expression.replace(/×/g, '*'); 
        const result = eval(expression);
        document.getElementById('display').value = formatNumber(result.toString());
    } catch (error) {
        document.getElementById('display').value = 'Error';
    }
}


function formatNumber(numStr) {
    return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function unformatNumber(formattedStr) {
    return formattedStr.replace(/\./g, '');
}

<!--Teks Efek-->
      const teks = "Terima kasih sudah mencoba🥰";
      let index = 0;
      const speed = 100;
      const delayAfterDone = 2000;

      function ketikUlang() {
        const target = document.getElementById("typing");
        if (index < teks.length) {
          target.innerHTML += teks.charAt(index);
          index++;
          setTimeout(ketikUlang, speed);
        } else {
          setTimeout(() => {
            target.innerHTML = "";
            index = 0;
            ketikUlang();
          }, delayAfterDone);
        }
      }

      document.addEventListener("DOMContentLoaded", ketikUlang);
</script>






    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
